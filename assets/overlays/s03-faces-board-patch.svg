<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b321b"/>
      <stop offset=".22" stop-color="#b26a2f"/>
      <stop offset=".48" stop-color="#41200f"/>
      <stop offset=".72" stop-color="#8a4a22"/>
      <stop offset="1" stop-color="#2b160d"/>
    </linearGradient>
    <radialGradient id="waxGlow" cx=".5" cy=".45" r=".75">
      <stop offset="0" stop-color="#ffd58a" stop-opacity=".95"/>
      <stop offset=".3" stop-color="#d56e2f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#64190d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".64"/>
    </filter>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">

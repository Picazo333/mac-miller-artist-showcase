<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="presentation" aria-hidden="true">
  <defs>
    <filter id="softShadow" x="-35%" y="-25%" width="170%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity=".48"/>
    </filter>
  </defs>
  <!--
    Full-frame coordinate wrapper for the exact approved Faces patch artwork.
    The overlay shares the 1672x941 master coordinate system, so object-fit /
    object-position cropping remains synchronized with the Faces master.
  -->
  <g transform="rotate(-1.4 962 410)" filter="url(#softShadow)">
    <image href="s03-faces-board-art.webp"
           x="900" y="255" width="124" height="310"
           preserveAspectRatio="xMidYMid meet"
           opacity=".99"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2=".72">
      <stop offset="0" stop-color="#060504"/>
      <stop offset=".42" stop-color="#090605"/>
      <stop offset=".78" stop-color="#0b0705"/>
      <stop offset="1" stop-color="#100906"/>
    </linearGradient>
    <radialGradient id="warmLift" cx=".88" cy=".74" r=".92">
      <stop offset="0" stop-color="#3a1a0c" stop-opacity=".16"/>
      <stop offset=".52" stop-color="#251106" stop-opacity=".07"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>

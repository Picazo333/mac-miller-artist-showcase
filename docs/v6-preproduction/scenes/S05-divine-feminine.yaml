      purpose: "Optional transparent warm backlight if CSS alone is insufficient"
      status: "OPTIONAL"
  html_controls:
    - "semantic h2"
    - "CTA anchor"
    - "accessible orbit toggle"

motion:
  enabled: true
  css_only: true
  effects:
    - "very slow orbital rotation"
    - "micro petal drift if approved"
  reduced_motion_fallback: "Static orbit/backlight state."


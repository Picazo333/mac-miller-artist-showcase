version: "1.0"
scene:
  id: "S05"
  slug: "divine-feminine"
  name: "The Divine Feminine"
  status: "DESKTOP_COMPOSITE_APPROVED"

reference:
  approved: true
  source_file_name: "santuario_celestial_entre_rosas_y_sueños.png"
  source_dimensions: "1672x941"
  visual_thesis: "A luminous romantic-surreal sanctuary organized around a monumental feminine profile with a high ponytail. The silhouette acts as both figure and portal, containing sky, city and landscape; Mac remains small and contemplative in the foreground."
  immutable_notes:
    - "The high-ponytail feminine silhouette is the dominant structural motif."
    - "The silhouette must remain a portal/negative-space device, not a celebrity poster."
    - "Mac remains small, seated and contemplative in the foreground."
    - "The circular architectural opening remains the main compositional frame."
    - "Roses, pale stone, water and warm sunset light remain."
    - "The glass slipper remains a small easter egg on the lower right."
    - "The scene must feel more intimate and stable than GO:OD AM and dramatically less unstable than Faces."
    - "No generic pink-romance redesign is allowed."

clean_master:
  approved: true
  asset_status: "APPROVED_EXTERNAL_MASTER"
  intended_repo_path: "assets/backgrounds/s05-divine-feminine-master"
  reference_protection:
    lock:
      - "high-ponytail feminine profile silhouette"
      - "Mac seated foreground figure"
      - "circular portal / arch"
      - "sunset sky and city inside silhouette"
      - "rose architecture"
      - "reflective water"
      - "glass slipper easter egg"
      - "warm ivory / blush / sunset-gold palette"
    clean:
      - "No generated navigation"
      - "No generated hero title"
      - "No generated CTA"
      - "No generic love slogans"
    flex:
      - "minor drifting petals"
      - "subtle reflection intensity"
      - "small peripheral floral density"

narrative:
  role: "Intimacy / softness / relational orbit"
  incoming_transition: "GO:OD AM's stable circle softens into a romantic portal organized by the feminine silhouette."
  outgoing_transition: "The portal and reflective water dissolve into Swimming's submerged interior."
  distortion_visual_only: 2
  governing_visual_law: "The world is stable; surrealism lives inside the silhouette and orbital relationships."

content:
  title: "The Divine Feminine"
  microcopy: ""
  microcopy_max_words: 12
  cta_label: "Escuchar The Divine Feminine"
  cta_target: "#swimming"
  visible_strategy: "Keep visible HTML minimal and place it outside the silhouette's facial profile and Mac."

safe_areas:
  protected:
    - "feminine profile and ponytail"
    - "Mac"
    - "circular portal"
    - "sunset core"
    - "glass slipper"
  flexible:
    - "upper-left pale architecture"
    - "lower-left floral foreground"
    - "far upper-right architecture"
  content_safe:
    - "small left-edge or lower-left text zone"
    - "CTA in lower peripheral band if it does not cover roses or Mac"

easter_eggs:
  raster_preserved:
    - "glass slipper"
    - "planet / celestial orb"
    - "paired embrace sculptures"
    - "rose portal"
  overlays:
    - "subtle orbital ring"
    - "backlight enhancement around ponytail silhouette"
    - "optional drifting-petal micro-layer"
  interactive:
    - id: "divine-orbit"
      target: "small planet/orb near the silhouette"
      purpose: "Activate a restrained orbit/backlight state around the silhouette without changing the composition."

interaction:
  enabled: true
  trigger_id: "divine-orbit"
  primitive: "checkbox_toggle"
  keyboard_accessible: true
  default_state: "still-orbit"
  active_state: "orbit-awake"
  visual_effects:
    - "one subtle orbital line appears around the small planet"
    - "slight warm backlight around the ponytail edge"
    - "very small reflection lift in the water"
    - "no camera movement"
    - "no large geometric overlay"
    - "no extra visible text"
  reduced_motion_behavior: "Static orbit/backlight state."

assets:
  svg:
    - id: "s05-orbit-ring"
      purpose: "Interactive orbital accent"
      status: "TO_REFINE"
  raster_overlays:

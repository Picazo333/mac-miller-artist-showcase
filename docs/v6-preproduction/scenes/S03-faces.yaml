version: "1.2"

scene:
  id: "S03"
  slug: "faces"
  name: "Faces"
  status: "SCENE_LOCKED"

reference:
  approved: true
  visual_thesis: "The visual peak of the site: a claustrophobic, hallucinatory room where masks, eyes, reflections and impossible architecture fold into one another like a bad acid trip while retaining the Faces identity."
  immutable_notes:
    - "The corrected central figure from master v2 remains seated on the bed as the human anchor."
    - "The short/shaved-hair head silhouette from v2 is frozen."
    - "The room remains more unstable and grotesque than every previous scene."
    - "The right reflection/face field remains the dominant secondary structure."
    - "Masks, repeated faces and eyes remain embedded throughout the room."
    - "The open city/sky rupture remains visible as an impossible spatial break."
    - "Candles, records, clutter and the cat remain part of the lived-in physical base."
    - "Faces is the maximum-distortion scene; no later scene may exceed this density or instability."


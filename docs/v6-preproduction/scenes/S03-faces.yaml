  source_dimensions: "1672x941"
  sha256: "e36777ab52d7e17d8037b57a7fe64cec8f14f84767a18788b6ca3345bd113457"
  supersedes_master: "v1-approved-pre-character-correction"
  intended_repo_path: "assets/backgrounds/s03-faces-master-v2"
  revision_scope: "Character-only correction. No redesign authorized."
  reference_protection:
    lock:
      - "corrected central figure pose, scale, head and hair treatment"
      - "right reflection/face field"
      - "left FACES wall treatment"
      - "surreal open city/sky rupture"
      - "masks, eyes and grotesque sculptural faces"
      - "cat on bed"
      - "candles, turntable and clutter"
      - "warm black, amber and dirty-crimson palette"
    clean:
      - "No generated navbar"
      - "No external content card covering the room"
      - "No visible HTML title duplication over the FACES wall treatment"
    flex:
      - "small candle-glow intensity"
      - "minor reflection highlights"
      - "small foreground clutter"
      - "tiny text fragments used only as texture"

factual_text_audit:
  preserve:
    - "FACES"
    - "small existential wall fragments used as texture rather than factual biography"
  texture_only:
    - "small handwritten notes"
    - "stack labels"
    - "non-semantic scribbles"
  remove_or_rebuild:
    - "any generated factual statement about the subject's mental state"
    - "any duplicated interface-style copy"

narrative:
  role: "Maximum fragmentation / visual collapse"
  incoming_transition: "Watching Movies screens, reflections and false exits multiply until no stable surface remains."
  outgoing_transition: "A surviving geometric/time motif becomes the cleaner recomposition logic of GO:OD AM."
  distortion_visual_only: 10
  governing_visual_law: "Identity, architecture and scale recurse until the room becomes a self-observing maze."

content:
  title: "Faces"
  microcopy: ""
  microcopy_max_words: 12
  cta_label: "Escuchar Faces"
  cta_target: "#good-am"
  visible_strategy: "Use the approved diegetic FACES wall treatment as the visible title; semantic HTML remains present without duplicating it visually."


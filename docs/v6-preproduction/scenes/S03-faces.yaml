qa_notes:
  - "HITL-B v1 rejected: overlay read as a large opaque terracotta graphic and broke visual fidelity."
  - "Repair rule: no large geometric plate, no opaque circle, no new standalone object."
  - "Interaction must live inside existing mirror shards and remain visually subordinate to the approved master."

qa_notes_v2:
  - "HITL-B v2 accepted by user."
  - "OFF state preserves the Clean Master; ON state is limited to existing mirror shards."

responsive_qa_notes:
  - "1024 PASS: major composition anchors survive."
  - "768 PASS: Mac, central rupture and mirror/faces structure survive."
  - "390 FAIL with simple crop: central rupture and Mac survive, but FACES lettering and mirror wall are not sufficiently represented together."
  - "Action: create dedicated 9:16 mobile alternate derived from the approved master; do not reinterpret the scene."

responsive_qa_notes:
  - "1024: PASS — Mac, FACES wall, central rupture and mirror wall remain legible."
  - "768: PASS — Mac, central rupture and mirror wall remain strong; FACES lettering is partially cropped."
  - "390: PASS — Mac, central rupture and mirror wall survive; FACES lettering is intentionally sacrificed to preserve the dominant composition."
  - "No alternate mobile master required at this stage."

final_approval_notes:
  - "Responsive proofs approved by user."
  - "S03 art direction remains the maximum-distortion ceiling for all later scenes."

master_revision_history:
  - version: "v1"
    status: "SUPERSEDED"
    reason: "Approved composition, but the central figure had incorrect hair/head appearance."
  - version: "v2-corrected"
    status: "APPROVED_CLEAN_MASTER"
    reason: "Character-only correction approved by user; composition, surrealism, density, lighting and easter-egg field remain frozen."
    invariant: "No redesign. Only the central figure correction is authorized."

revalidation_rule:
  - "Because the raster master changed, prior HITL-B and responsive approvals are evidence from v1 and cannot be carried forward automatically."
  - "Reuse the same approved interaction grammar; re-run composite and 1024/768/390 proofs on v2."
  - "If no drift appears, downstream approvals may be restored without any new art-direction decision."

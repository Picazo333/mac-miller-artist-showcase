reference:
  approved: true
  source_file_name: "homenaje_pixelado_bajo_la_luna.png"
  source_dimensions: "1672x941"
  sha256: "097988f051832dca82e7669e0c2380d68d1875d3ceefe89d26414218611d259f"
  visual_thesis: "The final scene repopulates the stage after Memorial through six small pixel-art figures. Mac stands at the center under a halo, surrounded by five collaborators/friends. The background remains nearly black, theatrical and restrained so the sprites carry the emotional resolution."
  immutable_notes:
    - "Pixel-art is mandatory for all six figures."
    - "Mac Miller remains centered and is the only figure with a halo."
    - "The five collaborators are Anderson .Paak, Action Bronson, Tyler, The Creator, Thundercat and ScHoolboy Q."
    - "The canonical left-to-right order is Anderson .Paak, Action Bronson, Mac Miller, Tyler, The Creator, Thundercat, ScHoolboy Q."
    - "The stage/background remains dark and sparse."
    - "The large moon remains a restrained background motif."
    - "No photoreal portraits are introduced into this scene."
    - "No generic motivational slogans are allowed."
    - "The mood is celebration-through-presence, not another memorial."

clean_master:
  asset: "homenaje_pixelado_bajo_la_luna.png"
  approved: true
  asset_status: "APPROVED_COMPOSITE_REFERENCE"
  intended_repo_path: "assets/backgrounds/s10-celebration-stage-master"
  production_strategy: "Use the approved composite as visual reference, but final implementation should separate stage background and six pixel sprites so each figure can be independently interactive."
  reference_protection:
    lock:
      - "dark stage"
      - "large moon"
      - "six-figure lineup"
      - "Mac in center with halo"
      - "left-to-right collaborator order"
      - "low-key warm stage reflection"
      - "pixel-art scale relationship"
    clean:
      - "No generated navigation"
      - "No generic slogan overlays"
      - "No baked-in collaborator labels required in final raster"
    flex:
      - "minor equipment silhouettes"
      - "halo intensity"
      - "small stage reflection"
      - "sprite spacing within approved order"
  factual_text_audit:
    preserve:
      - "GOLF lettering when used as part of Tyler, The Creator's pixel-art cap treatment"
    texture_only: []
    remove_or_rebuild:
      - "All collaborator names should be semantic HTML, not baked raster labels"
      - "Any biographical/collaboration facts must be verified before visible integration"

narrative:
  role: "Communal resolution / friends, collaborators and continuing influence"
  incoming_transition: "Memorial's empty stage becomes inhabited again, but symbolically and playfully."
  outgoing_transition: "Final scene. Navigation may return to Home / Archive without introducing a new narrative escalation."
  distortion_visual_only: 0
  governing_visual_law: "After absence, presence returns in simplified pixel form; the ending is communal, not grandiose."


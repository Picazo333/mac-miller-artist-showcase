name: Import approved Faces patch

on:
  push:
    branches: [faces-patch-exact]
    paths:
      - ".github/workflows/import-faces-patch.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: faces-patch-exact
      - name: Install WebP encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
      - name: Download approved patch and preserve alpha
        run: |
          set -euo pipefail
          mkdir -p assets/overlays /tmp/faces
          curl --fail --location --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/4d079e25-2469-4aca-ac7c-c42549294a50.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZGFjOTUyZmJlNjIxMzA2ZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTk1ODI2N30.b4i107uRlfelBVzBAntcwNm-5QMQuwUwLuJ4NU7iXxE' -o /tmp/faces/patch.png
          cwebp -quiet -q 92 -alpha_q 100 -m 6 /tmp/faces/patch.png -o assets/overlays/s03-faces-board-art.webp
      - name: Commit approved asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/overlays/s03-faces-board-art.webp
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "assets: add exact approved Faces board art [skip ci]"
            git push origin HEAD:faces-patch-exact
          fi

          cwebp -quiet -q 82 -resize 1440 0 /tmp/v6/s10.png -o assets/s10-celebration-stage.webp

          download 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/18112099-9aa5-4419-9988-3b4bcd65a734.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjE1ZDkxMzhiYjg3MDUwNyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTkwNTk3Nn0.uv6VYjllXtqe5Gk6gDQvC3fIPE8ntzIbNOKAzFT5XcI' assets/sprite-anderson-paak.png

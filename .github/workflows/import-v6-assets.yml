      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No asset changes."
          else
            git commit -m "assets: import approved V6 visual masters [skip ci]"
            git push origin HEAD:v6-final-integration
          fi

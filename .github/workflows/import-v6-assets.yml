name: Import V6 approved visual assets

on:
  push:
    branches: [v6-final-integration]
    paths:
      - ".github/workflows/import-v6-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v6-final-integration
      - name: Install WebP encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
      - name: Download and optimize approved scene masters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets /tmp/v6
          download () { curl --fail --location --retry 3 "$1" -o "$2"; }
